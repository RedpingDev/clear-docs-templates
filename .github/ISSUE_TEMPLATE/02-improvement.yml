name: 양식 개선 제안 / Improvement
description: 핵심을 더 쉽게 파악하도록 양식이나 작성 방법을 제안해주세요.
title: "[Idea] "
labels: [enhancement]
body:
  - type: input
    id: location
    attributes:
      label: 관련 문서 또는 양식 / Location
    validations:
      required: true
  - type: textarea
    id: difficulty
    attributes:
      label: 어떤 점이 읽기 어려웠나요? / Reading difficulty
      description: 독자와 사용 상황, 읽는 앱을 함께 적어주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안과 기대하는 효과 / Proposal and expected result
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 예시 또는 참고 화면 / Example (optional)
